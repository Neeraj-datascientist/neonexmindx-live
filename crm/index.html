<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoNeX MindX &mdash; Counsellor workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-blue: #0284C7;
      --primary-teal: #2A8B88;
      --primary-teal-hover: #227370;
      --sidebar-active-bg: #D1E5E3;
      --sidebar-active-color: #1A5E5B;
      --sidebar-hover-bg: #F1F5F9;
      --sidebar-text: #334155;
      --muted-gray: #64748B;
      --line-border: #E2E8F0;
      --card-bg: #FFFFFF;
      --body-bg: #FFFFFF;
      --hero-bg: #F4F6FC;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important; -webkit-font-smoothing: antialiased; }
    body {
      background: #FFFFFF !important;
      color: #0F172A;
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 220px 1fr;
      grid-template-rows: 60px 1fr;
      grid-template-areas: "side top" "side main";
    }
    @media (max-width: 900px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: 60px 1fr;
        grid-template-areas: "top" "main";
      }
      #sidebar {
        position: fixed;
        left: -240px;
        top: 0;
        bottom: 0;
        width: 230px;
        transition: left 0.25s ease;
        z-index: 90;
      }
      #sidebar.mobile-open { left: 0; }
      .mobile-menu-btn { display: inline-flex !important; }
    }
    .mobile-menu-btn { display: none; align-items: center; justify-content: center; background: none; border: none; font-size: 20px; cursor: pointer; color: #334155; margin-right: 12px; }
    button, input, select, textarea { font-family: inherit; font-size: inherit; }
    a { text-decoration: none; color: inherit; }

    /* SIDEBAR */
    #sidebar {
      grid-area: side;
      background: #FFFFFF;
      border-right: 1px solid var(--line-border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      z-index: 30;
      box-shadow: 4px 0 20px rgba(15, 23, 42, 0.02);
    }
    .brand-wrap {
      height: 68px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .brand-box {
      width: 34px;
      height: 34px;
      background: #1D4ED8;
      color: #FFFFFF;
      font-weight: 800;
      font-size: 16px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .nav-list { flex: 1; padding: 10px 10px 30px; overflow-y: auto; }
    .nav-sec-title {
      font-size: 9.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94A3B8;
      padding: 16px 12px 6px;
    }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      color: var(--sidebar-text);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-bottom: 3px;
      user-select: none;
    }
    .nav-link:hover { background: var(--sidebar-hover-bg); }
    .nav-link.active {
      background: var(--sidebar-active-bg);
      color: var(--sidebar-active-color);
      font-weight: 800;
    }
    .nav-link svg { width: 17px; height: 17px; stroke-width: 2.2; flex-shrink: 0; }
    .nav-link.active svg { stroke: var(--sidebar-active-color); }

    /* TOPBAR */
    #topbar {
      grid-area: top;
      background: #FFFFFF;
      border-bottom: 1px solid var(--line-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      z-index: 20;
    }
    .tb-header-title {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
    }
    .tb-header-title span { color: #64748B; font-weight: 600; margin-left: 6px; }
    .tb-actions { display: flex; align-items: center; gap: 14px; }
    .tb-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #FED7AA;
      color: #C2410C;
      font-size: 14px;
      font-weight: 800;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    /* MAIN CONTENT */
    #main-content {
      grid-area: main;
      overflow-y: auto;
      padding: 24px 32px 60px;
      background: #FFFFFF;
    }
    .workspace-wrapper { max-width: 1260px; margin: 0 auto; }

    /* DASHBOARD HERO BANNER (Pixel matched with Screenshot 1) */
    .counsellor-hero {
      background: var(--hero-bg);
      border-radius: 16px;
      padding: 26px 30px;
      margin-bottom: 24px;
      border: 1px solid #EEF2F6;
    }
    .c-date {
      font-size: 12px;
      font-weight: 700;
      color: #2563EB;
      margin-bottom: 8px;
    }
    .c-greeting {
      font-size: 26px;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 6px;
    }
    .c-sub {
      font-size: 13px;
      font-weight: 600;
      color: #64748B;
      margin-bottom: 18px;
    }
    .c-action-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-action-white {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 700;
      color: #1E293B;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
      transition: all 0.15s ease;
    }
    .btn-action-white:hover { border-color: #CBD5E1; background: #F8FAFC; }

    /* METRIC CARDS (4 COLUMNS - Screenshot 1) */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 24px;
    }
    .m-card {
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 18px 20px;
      background: #FFFFFF;
    }
    .m-title { font-size: 12.5px; font-weight: 600; color: #64748B; margin-bottom: 10px; }
    .m-value-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 24px;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 12px;
    }
    .m-icon {
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .m-link {
      font-size: 12px;
      font-weight: 700;
      color: #64748B;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .m-link:hover { color: #0284C7; }

    /* 2-COLUMN DASHBOARD SPLIT (Funnel + Priority) */
    .two-col-dash {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    .dash-box {
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 22px 24px;
      background: #FFFFFF;
    }
    .dash-box-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .dash-box-title { font-size: 15px; font-weight: 800; color: #0F172A; }
    .dash-pill-month {
      background: #EFF6FF;
      color: #2563EB;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }

    /* FUNNEL PROGRESS */
    .funnel-list { display: flex; flex-direction: column; gap: 14px; }
    .funnel-item {
      display: grid;
      grid-template-columns: 110px 1fr 24px;
      align-items: center;
      gap: 14px;
      font-size: 12.5px;
      font-weight: 600;
      color: #334155;
    }
    .funnel-track {
      height: 7px;
      background: #EEF2F6;
      border-radius: 999px;
      overflow: hidden;
    }
    .funnel-fill {
      height: 100%;
      background: #BFDBFE;
      border-radius: 999px;
    }
    .funnel-val { font-weight: 800; text-align: right; color: #0F172A; }

    /* TODAY'S PRIORITY CHECKLIST (Screenshot 1) */
    .p-list { display: flex; flex-direction: column; gap: 12px; }
    .p-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #1E293B;
      cursor: pointer;
    }
    .p-box {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
      flex-shrink: 0;
    }

    /* RECENT ENQUIRIES & UPCOMING (Screenshot 2) */
    .two-col-recent {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .empty-state-box {
      text-align: center;
      padding: 36px 20px;
      color: #64748B;
      font-size: 13px;
      font-weight: 600;
    }
    .empty-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 10px;
      background: #F1F5F9;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    /* DATA TABLES CONTAINER & TOOLBAR (Screenshots 3, 4, 5, 6) */
    .crm-table-card {
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      background: #FFFFFF;
      overflow: hidden;
    }
    .table-top-bar {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #F1F5F9;
    }
    .table-heading {
      font-size: 17px;
      font-weight: 800;
      color: #0F172A;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .table-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .crm-search-box {
      width: 240px;
      height: 36px;
      padding: 0 12px;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      font-weight: 600;
      color: #334155;
    }
    .crm-search-box:focus { border-color: var(--primary-teal); }
    .btn-crm-refresh {
      background: #FFFFFF;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 12.5px;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-crm-add {
      background: var(--primary-teal);
      border: 1px solid var(--primary-teal);
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 12.5px;
      font-weight: 700;
      color: #FFFFFF;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-crm-add:hover { background: var(--primary-teal-hover); }

    /* TABLES (Nunito font, clean grid) */
    table.crm-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    table.crm-table th {
      background: #F8FAFC;
      padding: 12px 20px;
      font-size: 12.5px;
      font-weight: 700;
      color: #475569;
      border-bottom: 1px solid #E2E8F0;
    }
    table.crm-table td {
      padding: 14px 20px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      border-bottom: 1px solid #F1F5F9;
      vertical-align: middle;
    }
    table.crm-table tr:hover td { background: #FAFAFA; }

    /* PAGINATION BAR (Screenshots 5, 6) */
    .pagination-bar {
      padding: 12px 20px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      border-top: 1px solid #F1F5F9;
    }
    .page-btn {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      border: 1px solid #CBD5E1;
      background: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: #334155;
    }
    .page-btn.active {
      border-color: var(--primary-teal);
      color: var(--primary-teal);
      font-weight: 800;
    }

    /* SETTINGS VIEW (Screenshot 9) */
    .settings-layout {
      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 28px;
    }
    .settings-card {
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 28px 32px;
      background: #FFFFFF;
    }
    .settings-menu {
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 16px 14px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .settings-nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
    }
    .settings-nav-item.active {
      color: var(--primary-teal);
      background: #F0FDFA;
    }
    .btn-save-teal {
      background: var(--primary-teal);
      color: #FFFFFF;
      padding: 8px 20px;
      border-radius: 6px;
      border: none;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(3px); z-index: 99; display: none; place-items: center; padding: 20px;
    }
    .modal-overlay.active { display: grid; }
    .modal-box {
      background: #FFFFFF; border-radius: 12px; width: 100%; max-width: 540px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); overflow: hidden;
    }
    .modal-header { padding: 16px 22px; border-bottom: 1px solid #E2E8F0; display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 15px; }
    .modal-body { padding: 20px 22px; max-height: 70vh; overflow-y: auto; }
    .modal-footer { padding: 12px 22px; background: #F8FAFC; border-top: 1px solid #E2E8F0; display: flex; justify-content: flex-end; gap: 8px; }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 5px; }
    .form-control { width: 100%; height: 38px; padding: 0 10px; border: 1px solid #CBD5E1; border-radius: 6px; font-size: 13px; font-weight: 600; outline: none; }
    .form-control:focus { border-color: var(--primary-teal); }

    /* AUTH GATEWAY */
    #auth-gate { position: fixed; inset: 0; background: #FFFFFF; z-index: 100; display: none; place-items: center; }
    #auth-gate.active { display: grid; }
    .auth-card { width: 100%; max-width: 380px; padding: 36px 30px; text-align: center; border: 1px solid #E2E8F0; border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }

    /* TOAST */
    .toast-tray { position: fixed; right: 24px; bottom: 24px; z-index: 110; display: flex; flex-direction: column; gap: 8px; }
    .toast-pill { background: #0F172A; color: #FFFFFF; padding: 9px 15px; border-radius: 6px; font-size: 12.5px; font-weight: 700; box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
  </style>
</head>
<body>

  <!-- AUTH GATE -->
  <div id="auth-gate">
    <div class="auth-card">
      <div class="brand-box" style="margin:0 auto 14px;width:40px;height:40px;font-size:18px;">N</div>
      <h2 style="font-size:19px;font-weight:800;margin-bottom:4px;">NeoNex MindX</h2>
      <p style="font-size:13px;font-weight:600;color:#64748B;margin-bottom:20px;">Counsellor workspace login</p>
      <form onsubmit="CRM.handleLogin(event)">
        <input type="password" id="auth-pass" class="form-control" placeholder="Enter password (Admin123!)" autofocus required style="margin-bottom:12px;" />
        <button type="submit" class="btn-crm-add" style="width:100%;justify-content:center;height:38px;">Sign In &rarr;</button>
      </form>
    </div>
  </div>

  <!-- SIDEBAR NAVIGATION (Exact match with Screenshots) -->
  <aside id="sidebar">
    <div class="brand-wrap">
      <div class="brand-box">N</div>
      <div class="brand-title">NeoNex MindX</div>
    </div>

    <div class="nav-list">
      <!-- CORE WORKSPACE -->
      <div class="nav-link active" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
        <span>Dashboard</span>
      </div>
      <div class="nav-link" data-view="students">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <span>Students</span>
      </div>
      <div class="nav-link" data-view="enquiries">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        <span>Enquiries</span>
      </div>
      <div class="nav-link" data-view="courses">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        <span>Courses</span>
      </div>
      <div class="nav-link" data-view="admissions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        <span>Admissions</span>
      </div>

      <!-- FINANCE SECTION -->
      <div class="nav-sec-title">FINANCE</div>
      <div class="nav-link" data-view="fees">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path><line x1="12" y1="6" x2="12" y2="8"></line><line x1="12" y1="16" x2="12" y2="18"></line></svg>
        <span>Fees</span>
      </div>
      <div class="nav-link" data-view="payments">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
        <span>Payments</span>
      </div>

      <!-- COUNSELLING SECTION -->
      <div class="nav-sec-title">COUNSELLING</div>
      <div class="nav-link" data-view="counselling">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
        <span>Counselling</span>
      </div>
      <div class="nav-link" data-view="followups">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        <span>Follow-ups</span>
      </div>
      <div class="nav-link" data-view="reports">

          <button onclick="CRM.closeModal()" style="padding:6px 14px;border:1px solid #CBD5E1;background:#FFF;border-radius:6px;cursor:pointer;font-weight:700;">Cancel</button>
          <button class="btn-crm-add" onclick="CRM.saveCourse()">Create Course</button>
        `;
        CRM.modal('Create New Course', body, footer);
      },

      saveCourse() {
        const title = (document.getElementById('ac-title')?.value || '').trim();
        const duration = (document.getElementById('ac-duration')?.value || '12-16 Weeks').trim();
        const fee = (document.getElementById('ac-fee')?.value || '$ 45,000.00').trim();
        const batches = (document.getElementById('ac-batches')?.value || '1 Active').trim();
        if (!title) return alert('Course title is required');

        APP_DATA.courses.unshift({ title, duration, fee, batches });
        CRM.save();
        CRM.closeModal();
        CRM.toast('Course created successfully!');
        CRM.render();
      },

      deleteCourse(idx) {
        if (!confirm('Remove this course?')) return;
        APP_DATA.courses.splice(idx, 1);
        CRM.save();
        CRM.toast('Course removed');
        CRM.render();
      },

      openBookCounselling() {
        const studentOptions = APP_DATA.students.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
        const body = `
          <div class="form-group">
            <label class="form-label">Student / Candidate *</label>
            <select id="bc-student" class="form-control">
              ${studentOptions || '<option value="Aarav Sharma">Aarav Sharma</option>'}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Session Date</label>
            <input type="text" id="bc-date" class="form-control" value="${new Date().toLocaleDateString('en-GB')}" />
          </div>
          <div class="form-group">
            <label class="form-label">Guidance Mode</label>
            <select id="bc-mode" class="form-control">
              <option value="Google Meet">Google Meet</option>
              <option value="Phone Call">Phone Call</option>
              <option value="In-Person Centre">In-Person Centre</option>
              <option value="Zoom">Zoom</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Guidance Notes</label>
            <textarea id="bc-notes" class="form-control" placeholder="Discuss course fit, batch timing, fee scholarships..."></textarea>
          </div>
        `;
        const footer = `
          <button onclick="CRM.closeModal()" style="padding:6px 14px;border:1px solid #CBD5E1;background:#FFF;border-radius:6px;cursor:pointer;font-weight:700;">Cancel</button>
          <button class="btn-crm-add" onclick="CRM.saveCounselling()">Book Session</button>
        `;
        CRM.modal('Book Counselling Session', body, footer);
      },

      saveCounselling() {
        const student = (document.getElementById('bc-student')?.value || 'Student Candidate').trim();
        const date = (document.getElementById('bc-date')?.value || new Date().toLocaleDateString('en-GB')).trim();
        const mode = (document.getElementById('bc-mode')?.value || 'Google Meet').trim();
        const notes = (document.getElementById('bc-notes')?.value || '').trim();

        const studentRec = APP_DATA.students.find(s => s.name === student);
        const phone = studentRec ? studentRec.phone : '+91 98765 43210';

        APP_DATA.counselling.unshift({ student, phone, date, mode, status: 'Scheduled', notes });
        CRM.save();
        CRM.closeModal();
        CRM.toast('Counselling session booked!');
        CRM.render();
      },

      deleteCounselling(idx) {
        if (!confirm('Remove this session?')) return;
        APP_DATA.counselling.splice(idx, 1);
        CRM.save();
        CRM.toast('Session removed');
        CRM.render();
      },

      openAddFollowup() {
        const body = `
          <div class="form-group">
            <label class="form-label">Student Name *</label>
            <input type="text" id="af-student" class="form-control" placeholder="Full name" required />
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number *</label>
            <input type="text" id="af-phone" class="form-control" placeholder="+91 98765 43210" required />
          </div>
          <div class="form-group">
            <label class="form-label">Follow-up Task *</label>
            <input type="text" id="af-action" class="form-control" placeholder="e.g. Send demo invite & syllabus brochure" required />
          </div>
          <div class="form-group">
            <label class="form-label">Due Date</label>
            <input type="text" id="af-date" class="form-control" value="${new Date().toLocaleDateString('en-GB')}" />
          </div>
        `;
        const footer = `
          <button onclick="CRM.closeModal()" style="padding:6px 14px;border:1px solid #CBD5E1;background:#FFF;border-radius:6px;cursor:pointer;font-weight:700;">Cancel</button>
          <button class="btn-crm-add" onclick="CRM.saveFollowup()">Add Task</button>
        `;
        CRM.modal('Add Follow-up Task', body, footer);
      },

      saveFollowup() {
        const student = (document.getElementById('af-student')?.value || '').trim();
        const phone = (document.getElementById('af-phone')?.value || '').trim();
        const action = (document.getElementById('af-action')?.value || '').trim();
        const date = (document.getElementById('af-date')?.value || new Date().toLocaleDateString('en-GB')).trim();
        if (!student || !action) return alert('Student and Task are required');

        APP_DATA.followups.unshift({ student, phone, action, date, status: 'Pending' });
        CRM.save();
        CRM.closeModal();
        CRM.toast('Follow-up task created!');
        CRM.render();
      },

      deleteFollowup(idx) {
        if (!confirm('Remove this follow-up?')) return;
        APP_DATA.followups.splice(idx, 1);
        CRM.save();
        CRM.toast('Follow-up removed');
        CRM.render();
      },

      deleteEnquiry(phone) {
        if (!confirm('Remove this enquiry?')) return;
        APP_DATA.enquiries = APP_DATA.enquiries.filter(e => e.phone !== phone);
        CRM.save();
        CRM.toast('Enquiry removed');
        CRM.render();
      },

      modal(title, body, footer) {
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-body').innerHTML = body;
        document.getElementById('modal-footer').innerHTML = footer;
        document.getElementById('crm-modal').classList.add('active');
      },

      closeModal() {
        document.getElementById('crm-modal').classList.remove('active');
      },

      toast(msg) {
        const tray = document.getElementById('toast-tray');
        const t = document.createElement('div');
        t.className = 'toast-pill';
        t.textContent = msg;
        tray.appendChild(t);
        setTimeout(() => t.remove(), 2500);
      },

      exportData(type) {
        let content, filename, mime;
        if (type === 'json') {
          content = JSON.stringify(APP_DATA, null, 2);
          filename = 'counsellor_crm_full_backup.json';
          mime = 'application/json';
        } else if (type === 'enquiries') {
          content = 'Candidate,Phone,Email,Program,Date,Status,Notes\n' + APP_DATA.enquiries.map(e => `"${e.name}","${e.phone}","${e.email}","${e.program}","${e.date}","${e.status}","${e.notes}"`).join('\n');
          filename = 'enquiries_export.csv';
          mime = 'text/csv';
        } else {
          content = 'Name,Country,Address,Phone,Email\n' + APP_DATA.students.map(s => `"${s.name}","${s.country}","${s.address}","${s.phone}","${s.email}"`).join('\n');
          filename = 'clients_list.csv';
          mime = 'text/csv';
        }
        const b = new Blob([content], { type: mime });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = filename;
        a.click();
        CRM.toast(`Downloaded ${filename}`);
      }
    };

    window.addEventListener('DOMContentLoaded', () => CRM.init());
  </script>
</body>
</html>
