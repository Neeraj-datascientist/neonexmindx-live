name: CI/CD Pipeline & Cloudflare Pages Auto-Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-and-test:
    name: Validate Website & Core Portals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Key Deployment Files
        run: |
          echo "Checking essential production files..."
          test -f "index.html" || { echo "index.html missing!"; exit 1; }
          test -f "crm/index.html" || { echo "crm/index.html missing!"; exit 1; }
          test -f "cms/index.html" || { echo "cms/index.html missing!"; exit 1; }
          test -f "_redirects" || { echo "_redirects missing!"; exit 1; }
          test -f "neonex-auth.js" || { echo "neonex-auth.js missing!"; exit 1; }
          echo "All essential core assets present."

      - name: Validate GTM Integration
        run: |
          echo "Verifying GTM container snippet presence..."
          grep -q "GTM-PG57R85H" index.html || { echo "GTM container missing from index.html!"; exit 1; }
          echo "GTM container verified successfully."

  deploy-to-cloudflare:
    name: Deploy to Cloudflare Pages
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=neonexmindx --commit-dirty=true
